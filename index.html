<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bot-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0d13;--card:#11151f;--card2:#161c29;--txt:#e8edf6;--mut:#7d8799;--mut2:#565f70;--grn:#22d992;--red:#f6465d;--acc:#4f7cff;--amb:#f0b90b;--bor:#1e2634;--bor2:#283245}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,sans-serif;padding:16px;max-width:1080px;margin:0 auto;font-size:14px}
.mono{font-family:'JetBrains Mono',monospace}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
h1{font-size:17px;font-weight:800;letter-spacing:1.5px;display:flex;align-items:center;gap:9px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btcbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bor);border-radius:10px;padding:6px 12px;font-size:12px}
.btcbox b{font-size:13px}
.sub{color:var(--mut);font-size:11.5px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap}
.sub span b{color:var(--txt);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:680px){.summary{grid-template-columns:repeat(6,1fr)}}
.sumcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bor);border-radius:13px;padding:12px 14px}
.sumcard .lbl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:5px}
.sumcard .val{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace}
.sumcard .det{font-size:11px;color:var(--mut);margin-top:3px}
.up{color:var(--grn)}.dn{color:var(--red)}.amb{color:var(--amb)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bor);border-radius:15px;padding:16px;overflow:hidden}
.bothead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.bothead h2{font-size:15px;font-weight:700}
.bothead .tag{font-size:10.5px;color:var(--mut);margin-top:2px}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.badge.live{background:rgba(34,217,146,.12);color:var(--grn);border:1px solid rgba(34,217,146,.3)}
.badge.wait{background:rgba(240,185,11,.1);color:var(--amb);border:1px solid rgba(240,185,11,.3)}
.eqrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.eq{font-size:30px;font-weight:800;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px}
.pnl{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace}
.pnl small{color:var(--mut);font-weight:500;font-family:'Inter';font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
@media(min-width:420px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card2);border:1px solid var(--bor);border-radius:9px;padding:8px 6px;text-align:center}
.kpi b{display:block;font-size:14px;font-family:'JetBrains Mono',monospace;font-weight:700}
.kpi span{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.chartbox{position:relative;height:170px;margin:8px 0 4px}
.chartbox.sm{height:110px}
.sec{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec .r{font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--mut2);font-weight:600;text-align:right;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;padding:5px 7px;border-bottom:1px solid var(--bor)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 7px;border-bottom:1px solid var(--bor);text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px}
td b{font-family:'Inter';font-size:12px}
tr:last-child td{border-bottom:none}
.side-L{color:var(--grn);font-weight:700}.side-S{color:var(--red);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--bor);border-radius:8px;padding:5px 9px;font-size:11px;margin:2px 3px 2px 0}
.chip b{font-family:'JetBrains Mono',monospace}
.chips{margin:4px 0}
.empty{color:var(--mut2);font-size:12px;padding:8px 0;font-style:italic}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0}
.splitbox{background:var(--card2);border:1px solid var(--bor);border-radius:9px;padding:8px 10px;font-size:11px}
.splitbox .t{color:var(--mut);font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:3px}
.splitbox b{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.heat{height:5px;background:var(--card2);border-radius:3px;margin-top:5px;overflow:hidden}
.heat i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--amb));border-radius:3px}
button.rf{background:var(--card2);color:var(--txt);border:1px solid var(--bor2);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter'}
button.rf:hover{border-color:var(--acc)}
.foot{color:var(--mut2);font-size:10.5px;text-align:center;margin:20px 0 8px;line-height:1.6}
</style>
</head>
<body>
<header>
 <h1><span class="dot"></span>BOT-DASHBOARD</h1>
 <div style="display:flex;gap:8px;align-items:center">
  <div class="btcbox" id="btcbox">BTC <b class="mono" id="btcP">–</b><span id="btcC" class="mono"></span></div>
  <button class="rf" onclick="load()">↻</button>
 </div>
</header>
<div class="sub" id="sub"><span>lade…</span></div>
<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>
<div class="foot">Paper-Trading · Bot-Daten aus GitHub (Verzögerung bis ~5 Min nach Lauf) · Kurse &amp; unrealisierte PnL live von OKX<br>Bot 1: Scalp/Trend 1h · Bot 2: Donchian-Breakout 6h — Auto-Refresh alle 5 Min</div>
<script>
const REPO='wgossen124-stack/trading-bot-';
const RAW='https://raw.githubusercontent.com/'+REPO+'/main/';
const BOTS=[
 {name:'BOT 1 · Scalp/Trend',tag:'GESTOPPT 25.07. — Mean Reversion ohne Edge (WR 25 %, PF 0,52)',file:'state.json',init:2000,stopped:true},
 {name:'BOT 2 · Donchian-Breakout',tag:'6h · 20 Paare · Entry N30 · Turtle-Exit N10 · 2×ATR-Stop',file:'state2.json',init:2000}
];
const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>(v>=0?'+':'')+v.toFixed(d);
const money=v=>'$'+v.toFixed(2);
const charts={};
Chart.defaults.color='#7d8799';Chart.defaults.borderColor='#1e2634';
Chart.defaults.font.family="'Inter',sans-serif";Chart.defaults.font.size=10;
async function getJson(u){try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now());if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function okx(path){try{const r=await fetch('https://www.okx.com/api/v5/'+path);const d=await r.json();return d.data||null;}catch(e){return null;}}
function stats(st,init,px){
 const locked=st.positions.reduce((a,p)=>a+p.margin,0);
 let unreal=0;st.positions.forEach(p=>{const l=px[p.sym];if(l!=null)unreal+=(p.side==='LONG'?l-p.price:p.price-l)*p.size;});
 const eq=st.bal+locked+unreal;
 const t=[...st.trades].sort((a,b)=>a.ts-b.ts);
 const w=t.filter(x=>x.pnl>0),l=t.filter(x=>x.pnl<=0);
 const gw=w.reduce((a,x)=>a+x.pnl,0),gl=Math.abs(l.reduce((a,x)=>a+x.pnl,0));
 let v=init,pk=init,maxdd=0;const curve=[{ts:new Date(st.started).getTime()||t[0]?.ts||Date.now(),v}];
 t.forEach(x=>{v+=x.pnl;pk=Math.max(pk,v);maxdd=Math.max(maxdd,(pk-v)/pk*100);curve.push({ts:x.ts,v});});
 const byDay={};t.forEach(x=>{const d=new Date(x.ts).toISOString().slice(0,10);byDay[d]=(byDay[d]||0)+x.pnl;});
 const days=Object.entries(byDay).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14);
 const L=t.filter(x=>x.side==='LONG'),S=t.filter(x=>x.side==='SHORT');
 const wrOf=a=>a.length?a.filter(x=>x.pnl>0).length/a.length*100:0;
 const pnlOf=a=>a.reduce((s,x)=>s+x.pnl,0);
 const reasons={};t.forEach(x=>{const r=reasons[x.reason]||(reasons[x.reason]={n:0,pnl:0});r.n++;r.pnl+=x.pnl;});
 const bySym={};t.forEach(x=>{const s=bySym[x.sym]||(bySym[x.sym]={n:0,pnl:0});s.n++;s.pnl+=x.pnl;});
 const symRank=Object.entries(bySym).sort((a,b)=>b[1].pnl-a[1].pnl);
 let streak=0;for(let i=t.length-1;i>=0;i--){const win=t[i].pnl>0;if(i===t.length-1)streak=win?1:-1;else if((streak>0)===win&&Math.sign(streak)!==0)streak+=Math.sign(streak);else break;}
 const today=new Date().toISOString().slice(0,10);
 const todayPnl=byDay[today]||0,todayN=t.filter(x=>new Date(x.ts).toISOString().slice(0,10)===today).length;
 const ddNow=st.peak>0?Math.max(0,(st.peak-eq)/st.peak*100):0;
 return {eq,locked,unreal,free:st.bal,heat:eq>0?locked/eq*100:0,
  pnl:eq-init,pct:(eq-init)/init*100,n:t.length,
  wr:t.length?w.length/t.length*100:0,pf:gl>0?gw/gl:(gw>0?99:0),
  avgW:w.length?gw/w.length:0,avgL:l.length?gl/l.length:0,
  exp:t.length?(gw-gl)/t.length:0,
  best:t.length?Math.max(...t.map(x=>x.pnl)):0,worst:t.length?Math.min(...t.map(x=>x.pnl)):0,
  maxdd,ddNow,curve,days,streak,todayPnl,todayN,
  long:{n:L.length,wr:wrOf(L),pnl:pnlOf(L)},short:{n:S.length,wr:wrOf(S),pnl:pnlOf(S)},
  reasons,symRank,trades:t};
}
function kpi(v,lbl,cls=''){return `<div class="kpi"><b class="${cls}">${v}</b><span>${lbl}</span></div>`;}
function botCard(i,b,st,px){
 if(!st)return `<div class="card"><div class="bothead"><div><h2>${b.name}</h2><div class="tag">${b.tag}</div></div><span class="badge wait">wartet</span></div><div class="empty">Wartet auf den ersten Lauf…</div></div>`;
 const s=stats(st,b.init,px);
 const cls=s.pnl>=0?'up':'dn';
 const posRows=st.positions.map(p=>{
  const lp=px[p.sym],u=lp!=null?(p.side==='LONG'?lp-p.price:p.price-lp)*p.size:null;
  const upct=u!=null?u/p.margin*100:null;
  const age=Math.round((Date.now()-p.ts)/36e5);
  return `<tr><td><b>${p.sym.replace('USDT','')}</b></td><td class="side-${p.side[0]}">${p.side}</td><td>${p.price.toPrecision(5)}</td><td>${p.sl.toPrecision(5)}</td><td>${money(p.margin)}</td><td class="${u==null?'':u>=0?'up':'dn'}">${u==null?'–':fmt(u)+'$'}</td><td class="${upct==null?'':upct>=0?'up':'dn'}">${upct==null?'–':fmt(upct,1)+'%'}</td><td>${age<48?age+'h':Math.round(age/24)+'d'}</td></tr>`;
 }).join('');
 const trRows=[...s.trades].reverse().slice(0,10).map(t=>{
  const d=new Date(t.ts),ds=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  const extra=t.entryType?`<td>${t.entryType}${t.score?' '+t.score:''}</td>`:'';
  return `<tr><td>${ds}</td><td><b>${t.sym.replace('USDT','')}</b></td><td class="side-${t.side[0]}">${t.side}</td>${extra}<td class="${t.pnl>=0?'up':'dn'}">${fmt(t.pnl)}$</td><td>${t.reason}</td></tr>`;
 }).join('');
 const hasType=s.trades.some(t=>t.entryType);
 const top=s.symRank.slice(0,3),flop=s.symRank.slice(-3).reverse();
 const rChips=Object.entries(s.reasons).map(([r,x])=>`<span class="chip">${r==='TP'?'✅':r==='SL'?'🛑':'⏱'} ${r} <b>${x.n}×</b> <b class="${x.pnl>=0?'up':'dn'}">${fmt(x.pnl,0)}$</b></span>`).join('');
 return `<div class="card">
  <div class="bothead"><div><h2>${b.name}</h2><div class="tag">${b.tag}</div></div><span class="badge ${b.stopped?'wait':'live'}">${b.stopped?'gestoppt':'live'}</span></div>
  <div class="eqrow"><span class="eq">${money(s.eq)}</span><span class="pnl ${cls}">${fmt(s.pnl)}$ (${fmt(s.pct,1)}%)</span>${st.positions.length?`<span class="pnl ${s.unreal>=0?'up':'dn'}" style="font-size:12px">${fmt(s.unreal)}$ <small>unreal.</small></span>`:''}</div>
  <div class="chartbox"><canvas id="eq${i}"></canvas></div>
  <div class="kpis">
   ${kpi(s.wr.toFixed(0)+'%','Winrate')}
   ${kpi(s.pf.toFixed(2),'P-Faktor',s.pf>=1.3?'up':s.pf<1?'dn':'')}
   ${kpi(fmt(s.exp,1)+'$','Erwartung/Trade',s.exp>=0?'up':'dn')}
   ${kpi(s.n,'Trades')}
   ${kpi('+'+s.avgW.toFixed(0)+'$','Ø Gewinn','up')}
   ${kpi('-'+s.avgL.toFixed(0)+'$','Ø Verlust','dn')}
   ${kpi(s.maxdd.toFixed(1)+'%','Max. DD')}
   ${kpi(s.streak===0?'–':(s.streak>0?s.streak+'W':(-s.streak)+'L'),'Serie',s.streak>0?'up':s.streak<0?'dn':'')}
  </div>
  <div class="split">
   <div class="splitbox"><div class="t">Long · ${s.long.n} Trades</div><b>${s.long.wr.toFixed(0)}% WR</b> · <b class="${s.long.pnl>=0?'up':'dn'}">${fmt(s.long.pnl,0)}$</b></div>
   <div class="splitbox"><div class="t">Short · ${s.short.n} Trades</div><b>${s.short.wr.toFixed(0)}% WR</b> · <b class="${s.short.pnl>=0?'up':'dn'}">${fmt(s.short.pnl,0)}$</b></div>
  </div>
  <div class="chips">${rChips}</div>
  <div class="sec">Tages-PnL <span class="r">Heute: <b class="${s.todayPnl>=0?'up':'dn'} mono">${fmt(s.todayPnl)}$</b> · ${s.todayN} Trades</span></div>
  <div class="chartbox sm"><canvas id="day${i}"></canvas></div>
  <div class="sec">Kapital <span class="r mono">frei ${money(s.free)} · gebunden ${money(s.locked)} (${s.heat.toFixed(0)}%)</span></div>
  <div class="heat"><i style="width:${Math.min(100,s.heat/40*100)}%"></i></div>
  <div class="sec">Offene Positionen (${st.positions.length})</div>
  ${st.positions.length?`<div style="overflow-x:auto"><table><tr><th>Pair</th><th>Seite</th><th>Entry</th><th>Stop</th><th>Margin</th><th>PnL</th><th>PnL%</th><th>Alter</th></tr>${posRows}</table></div>`:'<div class="empty">keine offenen Positionen</div>'}
  <div class="sec">Letzte Trades</div>
  ${s.n?`<div style="overflow-x:auto"><table><tr><th>Zeit</th><th>Pair</th><th>Seite</th>${hasType?'<th>Setup</th>':''}<th>PnL</th><th>Exit</th></tr>${trRows}</table></div>`:'<div class="empty">noch keine Trades</div>'}
  ${s.symRank.length>1?`<div class="sec">Beste / schlechteste Paare</div><div class="chips">${top.map(([sy,x])=>`<span class="chip">${sy.replace('USDT','')} <b class="${x.pnl>=0?'up':'dn'}">${fmt(x.pnl,0)}$</b> <span style="color:var(--mut2)">${x.n}×</span></span>`).join('')}<br>${flop.map(([sy,x])=>`<span class="chip">${sy.replace('USDT','')} <b class="${x.pnl>=0?'up':'dn'}">${fmt(x.pnl,0)}$</b> <span style="color:var(--mut2)">${x.n}×</span></span>`).join('')}</div>`:''}
 </div>`;
}
function drawCharts(i,st,init,px){
 if(!st)return;const s=stats(st,init,px);
 if(charts['eq'+i])charts['eq'+i].destroy();
 // Präzise Equity-Kurve: echte Zeitachse + segmentierte Farben (grün über Start, rot darunter)
 const pts=s.curve.map(p=>({x:p.ts,y:p.v}));
 // aktueller Stand (inkl. unrealisierter PnL) als letzter Punkt
 pts.push({x:Date.now(),y:s.eq});
 const segCol=c=>{const y0=c.p0.parsed.y,y1=c.p1.parsed.y;return (y0+y1)/2>=init?'#22d992':'#f6465d';};
 charts['eq'+i]=new Chart($('#eq'+i),{type:'line',data:{datasets:[{data:pts,borderWidth:2,pointRadius:0,pointHitRadius:10,tension:0,
   segment:{borderColor:segCol},
   borderColor:pts[pts.length-1].y>=init?'#22d992':'#f6465d',
   fill:{target:{value:init},above:'rgba(34,217,146,.08)',below:'rgba(246,70,93,.08)'}}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
   tooltip:{mode:'nearest',intersect:false,callbacks:{
    title:c=>new Date(c[0].parsed.x).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})+' Uhr',
    label:c=>' $'+c.parsed.y.toFixed(2)+' ('+(c.parsed.y-init>=0?'+':'')+(c.parsed.y-init).toFixed(2)+'$)'}}},
  scales:{x:{type:'linear',bounds:'data',ticks:{maxTicksLimit:7,maxRotation:0,
    callback:v=>{const d=new Date(v);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.';}},grid:{display:false}},
   y:{ticks:{maxTicksLimit:5,callback:v=>'$'+v.toFixed(0)},grid:{color:'#161c29'}}}}});
 if(charts['day'+i])charts['day'+i].destroy();
 charts['day'+i]=new Chart($('#day'+i),{type:'bar',data:{labels:s.days.map(d=>d[0].slice(8,10)+'.'+d[0].slice(5,7)),datasets:[{data:s.days.map(d=>d[1]),backgroundColor:s.days.map(d=>d[1]>=0?'rgba(34,217,146,.75)':'rgba(246,70,93,.75)'),borderRadius:3}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.y)+'$'}}},
  scales:{x:{grid:{display:false},ticks:{maxRotation:0,maxTicksLimit:7}},y:{ticks:{maxTicksLimit:4,callback:v=>fmt(v,0)},grid:{color:'#161c29'}}}}});
}
async function load(){
 const [s1,s2,commit,btc]=await Promise.all([
  getJson(RAW+BOTS[0].file),getJson(RAW+BOTS[1].file),
  getJson('https://api.github.com/repos/'+REPO+'/commits?per_page=1'),
  okx('market/ticker?instId=BTC-USDT')
 ]);
 const syms=[...new Set([...(s1?s1.positions:[]),...(s2?s2.positions:[])].map(p=>p.sym))];
 const px={};
 await Promise.all(syms.map(async s=>{const d=await okx('market/ticker?instId='+s.replace('USDT','-USDT-SWAP'));if(d&&d[0])px[s]=+d[0].last;}));
 // Funding-Monitor (Bot-3-Signal): Ø aktueller Funding-Raten annualisiert
 const frs=[];
 await Promise.all(['BTC','ETH','SOL','DOGE','BNB'].map(async s=>{
  const d=await okx('public/funding-rate?instId='+s+'-USDT-SWAP');
  if(d&&d[0]&&d[0].fundingRate)frs.push(+d[0].fundingRate);}));
 const fApr=frs.length?frs.reduce((a,b)=>a+b,0)/frs.length*3*365*100:null;
 if(btc&&btc[0]){const p=+btc[0].last,o=+btc[0].open24h,c=(p-o)/o*100;
  $('#btcP').textContent='$'+p.toLocaleString('de-DE',{maximumFractionDigits:0});
  $('#btcC').textContent=fmt(c,1)+'%';$('#btcC').className='mono '+(c>=0?'up':'dn');}
 $('#grid').innerHTML=botCard(0,BOTS[0],s1,px)+botCard(1,BOTS[1],s2,px);
 drawCharts(0,s1,BOTS[0].init,px);drawCharts(1,s2,BOTS[1].init,px);
 let tot=0,init=0,totToday=0,nOpen=0,totLocked=0,allT=0;
 [[s1,BOTS[0]],[s2,BOTS[1]]].forEach(([st,b])=>{if(!st)return;const s=stats(st,b.init,px);
  init+=b.init;tot+=s.eq;totToday+=s.todayPnl;nOpen+=st.positions.length;totLocked+=s.locked;allT+=s.n;});
 const tp=tot-init,tc=tp>=0?'up':'dn';
 $('#summary').innerHTML=
  `<div class="sumcard"><div class="lbl">Gesamt-Equity</div><div class="val">${money(tot)}</div><div class="det">Start $${init.toFixed(0)}</div></div>`+
  `<div class="sumcard"><div class="lbl">Gesamt-PnL</div><div class="val ${tc}">${fmt(tp)}$</div><div class="det ${tc}">${fmt(init?tp/init*100:0,1)}%</div></div>`+
  `<div class="sumcard"><div class="lbl">Heute</div><div class="val ${totToday>=0?'up':'dn'}">${fmt(totToday)}$</div><div class="det">realisiert (UTC)</div></div>`+
  `<div class="sumcard"><div class="lbl">Positionen</div><div class="val">${nOpen}</div><div class="det">${money(totLocked)} gebunden</div></div>`+
  `<div class="sumcard"><div class="lbl">Trades gesamt</div><div class="val">${allT}</div><div class="det">beide Bots</div></div>`+
  `<div class="sumcard"><div class="lbl">Funding-APR Ø</div><div class="val ${fApr==null?'':fApr>=15?'up':fApr>=5?'amb':''}">${fApr==null?'–':fApr.toFixed(1)+'%'}</div><div class="det">Bot-3-Signal ab ~15%</div></div>`;
 let sub=`<span>Stand: <b>${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</b></span>`;
 if(commit&&commit[0])sub+=`<span>Letzter Bot-Lauf: <b>${new Date(commit[0].commit.committer.date).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b></span>`;
 if(s1)sub+=`<span>Bot 1 Läufe: <b>${s1.runs}</b></span>`;
 if(s2)sub+=`<span>Bot 2 Läufe: <b>${s2.runs}</b></span>`;
 $('#sub').innerHTML=sub;
}
load();
setInterval(load,5*60*1000);
</script>
