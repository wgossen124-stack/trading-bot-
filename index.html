<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bot-Dashboard</title>
<style>
:root{--bg:#0b0e14;--card:#131822;--card2:#1a2130;--txt:#e6ebf4;--mut:#8a94a8;--grn:#2ee6a8;--red:#ff5d73;--acc:#5b8cff;--bor:#232b3d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px;max-width:900px;margin:0 auto}
h1{font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.sub{color:var(--mut);font-size:12px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bor);border-radius:14px;padding:14px}
.card h2{font-size:14px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .tag{font-size:10px;color:var(--mut);font-weight:400}
.eq{font-size:28px;font-weight:700;margin:6px 0 0}
.pnl{font-size:14px;font-weight:600;margin-bottom:8px}
.up{color:var(--grn)}.dn{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{background:var(--card2);border-radius:8px;padding:7px 4px;text-align:center}
.stat b{display:block;font-size:14px}
.stat span{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
svg.curve{width:100%;height:70px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
th{color:var(--mut);font-weight:500;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:4px 6px}
td{padding:5px 6px;border-top:1px solid var(--bor)}
.sec{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:12px 0 2px}
.side-L{color:var(--grn);font-weight:600}.side-S{color:var(--red);font-weight:600}
.empty{color:var(--mut);font-size:12px;padding:8px 0}
.total{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#16203a,#131822);border:1px solid var(--bor);border-radius:14px;padding:14px;margin-bottom:14px}
.total .eq{font-size:24px;margin:0}
.foot{color:var(--mut);font-size:11px;text-align:center;margin:18px 0 8px}
button{background:var(--card2);color:var(--txt);border:1px solid var(--bor);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<h1><span class="dot"></span>BOT-DASHBOARD</h1>
<div class="sub" id="sub">lade…</div>
<div class="total"><div><div style="font-size:11px;color:var(--mut)">GESAMT (beide Bots)</div><div class="eq" id="totEq">–</div></div><div style="text-align:right"><div class="pnl" id="totPnl">–</div><button onclick="load()">↻ Aktualisieren</button></div></div>
<div class="grid" id="grid"></div>
<div class="foot">Paper-Trading · Daten aus GitHub (Verzögerung bis ~5 Min) · Unrealisierte PnL live von OKX</div>
<script>
const REPO='wgossen124-stack/trading-bot-';
const RAW='https://raw.githubusercontent.com/'+REPO+'/main/';
const BOTS=[
 {name:'BOT 1 · Scalp/Trend',tag:'1h · 31 Paare · Score≥90',file:'state.json',init:2000},
 {name:'BOT 2 · Donchian-Breakout',tag:'6h · 20 Paare · N30/N10 · Turtle-Exit',file:'state2.json',init:2000}
];
const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>(v>=0?'+':'')+v.toFixed(d);
const money=v=>'$'+v.toFixed(2);
async function getJson(u){try{const r=await fetch(u+'?t='+Date.now());if(!r.ok)return null;return await r.json();}catch(e){return null;}}
async function okxLast(syms){
 const out={};
 await Promise.all(syms.map(async s=>{try{
  const inst=s.replace('USDT','-USDT-SWAP');
  const r=await fetch('https://www.okx.com/api/v5/market/ticker?instId='+inst);
  const d=await r.json();if(d.data&&d.data[0])out[s]=+d.data[0].last;
 }catch(e){}}));
 return out;
}
function curve(trades,init){
 const t=[...trades].sort((a,b)=>a.ts-b.ts);
 let v=init;const pts=[v];t.forEach(x=>{v+=x.pnl;pts.push(v);});
 if(pts.length<2)return '';
 const min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1;
 const W=300,H=70,P=4;
 const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1),H-P-(p-min)/rng*(H-2*P)]);
 const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 const base=H-P-(init-min)/rng*(H-2*P);
 const col=pts[pts.length-1]>=init?'var(--grn)':'var(--red)';
 return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" y1="${base.toFixed(1)}" x2="${W}" y2="${base.toFixed(1)}" stroke="var(--bor)" stroke-dasharray="3 3"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.8"/></svg>`;
}
function botCard(b,st,px){
 if(!st)return `<div class="card"><h2>${b.name} <span class="tag">${b.tag}</span></h2><div class="empty">Wartet auf den ersten Lauf…</div></div>`;
 const locked=st.positions.reduce((a,p)=>a+p.margin,0);
 let unreal=0,unrealKnown=true;
 st.positions.forEach(p=>{const l=px[p.sym];if(l==null){unrealKnown=false;return;}unreal+=(p.side==='LONG'?l-p.price:p.price-l)*p.size;});
 const eq=st.bal+locked+(unrealKnown?unreal:0);
 const pnl=eq-b.init,pct=pnl/b.init*100;
 const w=st.trades.filter(t=>t.pnl>0),l=st.trades.filter(t=>t.pnl<=0);
 const wr=st.trades.length?w.length/st.trades.length*100:0;
 const gw=w.reduce((a,t)=>a+t.pnl,0),gl=Math.abs(l.reduce((a,t)=>a+t.pnl,0));
 const pf=gl>0?(gw/gl):(gw>0?99:0);
 const dd=st.peak>0?Math.max(0,(st.peak-eq)/st.peak*100):0;
 const cls=pnl>=0?'up':'dn';
 const posRows=st.positions.map(p=>{
  const lp=px[p.sym],u=lp!=null?(p.side==='LONG'?lp-p.price:p.price-lp)*p.size:null;
  const age=Math.round((Date.now()-p.ts)/36e5);
  return `<tr><td><b>${p.sym.replace('USDT','')}</b></td><td class="side-${p.side[0]}">${p.side}</td><td>${p.price.toPrecision(5)}</td><td>${p.sl.toPrecision(5)}</td><td class="${u==null?'':u>=0?'up':'dn'}">${u==null?'–':fmt(u)+'$'}</td><td>${age<48?age+'h':Math.round(age/24)+'d'}</td></tr>`;
 }).join('');
 const trRows=[...st.trades].sort((a,b2)=>b2.ts-a.ts).slice(0,8).map(t=>{
  const d=new Date(t.ts),ds=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  return `<tr><td>${ds}</td><td><b>${t.sym.replace('USDT','')}</b></td><td class="side-${t.side[0]}">${t.side}</td><td class="${t.pnl>=0?'up':'dn'}">${fmt(t.pnl)}$</td><td>${t.reason}</td></tr>`;
 }).join('');
 return `<div class="card">
  <h2>${b.name} <span class="tag">${b.tag}</span></h2>
  <div class="eq">${money(eq)}</div>
  <div class="pnl ${cls}">${fmt(pnl)}$ (${fmt(pct,1)}%)${unrealKnown&&st.positions.length?` · davon ${fmt(unreal)}$ unrealisiert`:''}</div>
  ${curve(st.trades,b.init)}
  <div class="stats">
   <div class="stat"><b>${wr.toFixed(0)}%</b><span>Winrate</span></div>
   <div class="stat"><b>${pf.toFixed(2)}</b><span>P-Faktor</span></div>
   <div class="stat"><b>${st.trades.length}</b><span>Trades</span></div>
   <div class="stat"><b>${dd.toFixed(1)}%</b><span>Drawdown</span></div>
  </div>
  <div class="sec">Offene Positionen (${st.positions.length})</div>
  ${st.positions.length?`<table><tr><th>Pair</th><th>Seite</th><th>Entry</th><th>Stop</th><th>PnL</th><th>Alter</th></tr>${posRows}</table>`:'<div class="empty">keine</div>'}
  <div class="sec">Letzte Trades</div>
  ${st.trades.length?`<table><tr><th>Zeit</th><th>Pair</th><th>Seite</th><th>PnL</th><th>Grund</th></tr>${trRows}</table>`:'<div class="empty">noch keine</div>'}
 </div>`;
}
async function load(){
 $('#sub').textContent='lade…';
 const [s1,s2,commit]=await Promise.all([
  getJson(RAW+BOTS[0].file),getJson(RAW+BOTS[1].file),
  getJson('https://api.github.com/repos/'+REPO+'/commits?per_page=1')
 ]);
 const syms=[...new Set([...(s1?s1.positions:[]),...(s2?s2.positions:[])].map(p=>p.sym))];
 const px=await okxLast(syms);
 $('#grid').innerHTML=botCard(BOTS[0],s1,px)+botCard(BOTS[1],s2,px);
 let tot=0,init=0;
 [[s1,BOTS[0]],[s2,BOTS[1]]].forEach(([st,b])=>{if(!st)return;init+=b.init;
  const locked=st.positions.reduce((a,p)=>a+p.margin,0);
  let u=0;st.positions.forEach(p=>{const l=px[p.sym];if(l!=null)u+=(p.side==='LONG'?l-p.price:p.price-l)*p.size;});
  tot+=st.bal+locked+u;});
 $('#totEq').textContent=init?money(tot):'–';
 $('#totPnl').innerHTML=init?`<span class="${tot-init>=0?'up':'dn'}">${fmt(tot-init)}$ (${fmt((tot-init)/init*100,1)}%)</span>`:'–';
 let sub='Stand: '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 if(commit&&commit[0])sub+=' · letzter Bot-Lauf: '+new Date(commit[0].commit.committer.date).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 $('#sub').textContent=sub;
}
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
