name: cloud-bot
on:
  schedule:
    - cron: '6 * * * *'   # stündlich, 6 Min nach Kerzenschluss
  workflow_dispatch: {}     # manueller Start über Actions-Tab möglich
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bot-Lauf
        run: node bot.js
      - name: Bot-2-Lauf (Donchian 6h)
        run: node bot2.js
        continue-on-error: true   # Bot-2-Fehler blockiert Bot 1 nicht
      - name: Ergebnisse committen
        run: |
          git config user.name "cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "run $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
