name: cloud-bot
on:
  schedule:
    - cron: '6 * * * *'   # stündlich, 6 Min nach Kerzenschluss
  workflow_dispatch: {}     # manueller Start über Actions-Tab möglich
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Bot 1 (bot.js) wurde am 25.07.2026 eingestellt: kein Edge (-16 % über 63 Trades).
      # bot.js und state.json bleiben als Archiv im Repo.
      - name: Bot-2-Lauf (Donchian 6h)
        run: node bot2.js
        continue-on-error: true
      # Bot 3 und 4 sind UNVALIDIERT (Walk-Forward nicht bestanden) und laufen
      # ausschließlich als Papiergeld-Forward-Test. Siehe BOT34-KRITERIEN.md.
      - name: Bot-3-Lauf (Momentum 1D)
        run: node bot3.js
        continue-on-error: true
      - name: Bot-4-Lauf (Sweep-Reversal 4h)
        run: node bot4.js
        continue-on-error: true
      - name: Ergebnisse committen
        run: |
          git config user.name "cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "run $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
