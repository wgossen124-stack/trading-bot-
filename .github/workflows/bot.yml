name: cloud-bot
on:
  schedule:
    # Alle 15 Minuten statt stündlich (geändert 29.07.2026).
    # Grund: GitHub drosselt geplante Workflows. Gemessen an 412 echten Läufen
    # betrug der Median-Abstand 1,54 h und das Maximum 5,2 h — der Bot lief also
    # NICHT stündlich. Dadurch fielen Kerzenschlüsse in Lücken und Einstiegs-
    # signale wurden verworfen. Mehr geplante Versuche = höhere Trefferquote.
    # Die eigentliche Absicherung sitzt aber in den Bots (maxEntryAge + Live-Kurs).
    #
    # Nachtrag 18.10.2026: */15 hat drei Wochen gewirkt (Median 0,59 h), dann
    # brach es am 24.08. — dem letzten Commit von Hand — auf ~5 Läufe/Tag ein
    # (Median 4,6 h, Maximum 9,9 h). GitHub drosselt Schedules in Repos ohne
    # menschliche Aktivität und schaltet sie nach 60 Tagen ganz ab. Der Schedule
    # ist deshalb nur noch Fallback; der eigentliche Takt kommt von außen über
    # workflow_dispatch (cron-job.org, stündlich). Siehe RUNNER.md.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}     # Takt von außen (cron-job.org) und manueller Start, siehe RUNNER.md
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Bot 1 (bot.js) wurde am 25.07.2026 eingestellt: kein Edge (-16 % über 63 Trades).
      # bot.js und state.json bleiben als Archiv im Repo.
      - name: Bot-2-Lauf (Donchian 6h)
        run: node bot2.js
        continue-on-error: true
      # Bot 3 (bot3.js) und Bot 5 (bot5.js) sind UNVALIDIERT und laufen
      # ausschliesslich als Papiergeld-Forward-Test. Siehe BOT34-KRITERIEN.md
  # bzw. BOT3-ERSATZ-KRITERIEN.md.
  # bot4.js (Sweep-Reversal) am 05.08.2026 abgeschaltet: -48,6 % ueber 2 Jahre auf
  # 1.204 Trades, 0 von 21 Gitterkombis in-sample positiv. Bleibt als Archiv im Repo.
      # BOT 2 (bot3.js, Momentum 1D) am 21.08.2026 abgeschaltet: Walk-Forward nicht
      # bestanden, und live -12,6 % (PF 0,28) in einem Markt, der im selben Zeitraum
      # +25,6 % gemacht hat. Die Short-Seite wird in Rallyes zerlegt. Archiv bleibt.
      - name: Bot-5-Lauf (SMA150-Trendfilter 1D)
        run: node bot5.js
        continue-on-error: true
      - name: Ergebnisse committen
        run: |
          git config user.name "cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
            exit 0
          fi
          git commit -m "run $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Push mit Rebase und Wiederholung (ergänzt 29.07.2026).
          # Vorher stand hier ein einziges 'git push'. Wurde in der Zwischenzeit
          # irgendetwas anderes ins Repo committet — etwa eine Dashboard-Änderung —,
          # scheiterte der Push und der GESAMTE Bot-Lauf ging verloren: Einstiege,
          # Ausstiege, Zustandsänderungen, alles weg, ohne dass es auffiel.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt (Versuch $i) — rebase und erneut versuchen."
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "Push nach 5 Versuchen fehlgeschlagen — Zustand NICHT gespeichert."
          exit 1
      # Wächter (ergänzt 18.10.2026): healthchecks.io bekommt nach jedem Lauf einen
      # Ping. Bleibt er länger als die dort eingestellte Frist aus, kommt ein Alarm.
      # Ohne das lief der Runner sieben Wochen auf einem Fünftel des Takts, ohne
      # dass es jemand merkte. Ist das Push-Ergebnis schlecht, geht der Ping an
      # /fail, damit auch ein verlorener Lauf sichtbar wird. Fehlt das Secret
      # HC_PING_URL, wird nur gewarnt — der Bot-Lauf selbst hängt nicht daran.
      - name: Wächter-Ping (healthchecks.io)
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_URL" ]; then
            echo "::warning::Secret HC_PING_URL fehlt — kein Wächter-Ping. Siehe RUNNER.md."
            exit 0
          fi
          url="$HC_PING_URL"
          [ "$JOB_STATUS" = "success" ] || url="$HC_PING_URL/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$url?rid=$GITHUB_RUN_ID" \
            && echo "Ping gesendet ($JOB_STATUS)." \
            || echo "::warning::Ping an healthchecks.io fehlgeschlagen."
