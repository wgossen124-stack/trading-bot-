name: cloud-bot
on:
  schedule:
    - cron: '6 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bot-Lauf
        run: node bot.js
      - name: Ergebnisse committen
        run: |
          git config user.name "cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "bot run"
          git push
